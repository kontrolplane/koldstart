[package]
name = "quote"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
lambda_http = { version = "1.3.2", default-features = false, features = ["apigw_http", "tracing"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
