service: ledger

provider:
  name: aws
  runtime: nodejs22.x
  region: eu-west-1
  versionFunctions: false
  kmsKeyArn: arn:aws:kms:eu-west-1:123456789012:key/1111-2222
  tracing:
    lambda: true
    apiGateway: true
  stackTags:
    team: payments
    cost-centre: "42"
  tags:
    cost-centre: "43"
  logs:
    httpApi:
      format: '{"id":"$context.requestId","status":"$context.status"}'
    lambda:
      logFormat: JSON
      applicationLogLevel: warn
      systemLogLevel: INFO
    restApi: true
    websocket: true
    frameworkLambda: true

functions:
  api:
    handler: src/api.handler
    tags:
      tier: web
    events:
      - httpApi:
          method: POST
          path: /internal
          authorizer:
            type: aws_iam
  charge:
    handler: src/charge.handler
    tracing: PassThrough
    onError: arn:aws:sns:eu-west-1:123456789012:charge-failed
    maximumRetryAttempts: 1
    maximumEventAge: 3600
    destinations:
      onSuccess: settle
      onFailure:
        type: sqs
        arn:
          Fn::GetAtt: [Failed, Arn]
    provisionedConcurrency: 2
  settle:
    handler: src/settle.handler
    kmsKeyArn: arn:aws:kms:eu-west-1:123456789012:key/3333-4444
    vpc:
      subnetIds:
        - subnet-1
      securityGroupIds:
        - sg-1
    fileSystemConfig:
      localMountPath: /mnt/ledger
      arn: arn:aws:elasticfilesystem:eu-west-1:123456789012:access-point/fsap-1
    snapStart: true
    events:
      - sqs:
          arn:
            Fn::GetAtt: [Jobs, Arn]
          maximumConcurrency: 5
          enabled: false
      - stream:
          type: kinesis
          arn:
            Fn::GetAtt: [Clicks, Arn]
          maximumRetryAttempts: 3
          maximumRecordAgeInSeconds: 3600
          bisectBatchOnFunctionError: true
          parallelizationFactor: 4
          tumblingWindowInSeconds: 60
          consumer: true
          destinations:
            onFailure:
              arn:
                Fn::GetAtt: [Failed, Arn]
              type: sqs
  audit:
    handler: src/audit.handler
    events:
      - cloudwatchLog: /aws/lambda/ledger-dev-charge
      - cloudwatchLog:
          logGroup: /ecs/web
          filter: ERROR
      - eventBridge:
          pattern:
            source:
              - ledger
          inputTransformer:
            inputPathsMap:
              id: $.detail.id
            inputTemplate: '{"id": <id>}'
          retryPolicy:
            maximumRetryAttempts: 4
            maximumEventAge: 7200
          deadLetterQueueArn:
            Fn::GetAtt: [Failed, Arn]
      - eventBridge:
          pattern:
            source:
              - billing
          inputPath: $.detail
      - alb:
          listenerArn: arn:aws:elasticloadbalancing:eu-west-1:123456789012:listener/app/ledger/1/2
          priority: 5
          conditions:
            path: /audit
            header:
              name: X-Tenant
              values:
                - acme
            query:
              format: json
            ip:
              - 10.0.0.0/8
  report:
    handler: src/report.main
    runtime: python3.13
    snapStart: true

resources:
  Resources:
    Jobs:
      Type: AWS::SQS::Queue
      Properties:
        VisibilityTimeout: 60
    Failed:
      Type: AWS::SQS::Queue
    Clicks:
      Type: AWS::Kinesis::Stream
      Properties:
        ShardCount: 1
