version: 2
updates:
  # Conventional commit prefixes, so dependency pull requests follow CONTRIBUTING.md.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      aws:
        patterns:
          - "github.com/aws/*"
      charm:
        patterns:
          - "charm.land/*"
          - "github.com/charmbracelet/*"
      other:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: docker-compose
    directories:
      - /
      - /vhs
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: gomod
    directory: /examples/full-featured
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(examples)
    groups:
      example:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /examples/full-featured
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(examples)
    groups:
      example:
        patterns:
          - "*"
