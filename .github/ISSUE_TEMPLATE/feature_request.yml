name: Feature request
description: Suggest an idea or improvement for koldstart
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that koldstart doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like koldstart to do? A property in koldstart.pkl, a command, a view in kdst ui?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've thought about, such as how the serverless framework, sst or cdk does it.
    validations:
      required: false
