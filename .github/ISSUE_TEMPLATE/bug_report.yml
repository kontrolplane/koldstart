name: Bug report
description: Report a problem with koldstart
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please do **not** report security
        vulnerabilities here: see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The koldstart.pkl, or the smallest part of it that shows the bug, and what you ran. Leave out account ids, arns and secrets you would rather keep private.
      placeholder: |
        1. With this koldstart.pkl ...
        2. Run `kdst ...`
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - configuration (pkl)
        - build and packaging
        - plan and deploy
        - events
        - resources (cloud control)
        - state and locking
        - secrets
        - local invoke and offline
        - logs
        - migrate
        - terminal interface (kdst ui)
        - container image or homebrew
        - docs
        - not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `kdst version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: The os and architecture koldstart ran on, or the ci runner.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The output, or debug.log from a run with `--debug`. This is rendered as code.
      render: shell
    validations:
      required: false
